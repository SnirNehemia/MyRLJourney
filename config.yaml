project:
  version: "1.5.2"
  seed: 0

active_env: "LunarLander-v3" 

save_parameters:
  run_name: "SAVE_NAME"
  n_gifs: 5
  show_plots: false # Set to true to display plots, false to only save them
  add_saliency_to_gif: true # Set to true to add a saliency plot to the GIF

environments:
  "LunarLander-v3":
    state_size: 8
    action_size: 4
    win_condition: 200.0
    network:
      hidden_size: [128, 128]
    state_labels: ['X-pos', 'Y-pos', 'X-vel', 'Y-vel', 'Angle', 'Ang-vel', 'Leg1', 'Leg2']
    action_labels: ['No-Op', 'Left', 'Main', 'Right']
    use_fake_actions: false
    num_fake_actions: 6
    fake_action_maps_to: 0 # The real action that fake actions should map to
    q_plot_range: [-200, 200] # For GIF Q-value plot
    sparse_reward: false
      
    lunar_params:
      gravity: -10.0
      enable_wind: true
      wind_power: 1.0
      turbulence_power: 0.1

  "LunarLanderContinuous-v2":
    state_size: 8
    action_size: 2 # Continuous
    win_condition: 200.0
    network:
      hidden_size: [128, 128]
    state_labels: ['X-pos', 'Y-pos', 'X-vel', 'Y-vel', 'Angle', 'Ang-vel', 'Leg1', 'Leg2']
    action_labels: ['Main Engine', 'Side Engine']
    use_fake_actions: false
    num_fake_actions: 0
    fake_action_maps_to: 0 
    q_plot_range: [-200, 200]
    sparse_reward: false
    is_continuous: true
    lunar_params:
      gravity: -10.0
      enable_wind: false

  "Acrobot-v1":
    state_size: 6
    action_size: 3
    win_condition: -100.0
    network:
      hidden_size: [64, 64]
    action_labels: ['Torque -1', 'Torque 0', 'Torque +1']
    use_fake_actions: false
    num_fake_actions: 6
    fake_action_maps_to: 0 # The real action that fake actions should map to
    v_plot_range: [-500, 0] # For A2C critic value plot

  "CartPole-v1":
    state_size: 4
    action_size: 2
    win_condition: 475.0
    network:
      hidden_size: [32, 32]
    use_fake_actions: false
    num_fake_actions: 3
    fake_action_maps_to: 0 # The real action that fake actions should map to

  "MountainCar-v0":
    state_size: 2
    action_size: 3
    win_condition: -110.0 # Solved is avg score of -110.0 over 100 consecutive trials.
    network:
      hidden_size: [64, 64]
    state_labels: ['Position', 'Velocity']
    action_labels: ['Push Left', 'No Push', 'Push Right']
    use_fake_actions: false
    num_fake_actions: 2
    fake_action_maps_to: 1 # The real action that fake actions should map to
    q_plot_range: [-200, 50] # For GIF Q-value plot

  # NOTE: The environments below have CONTINUOUS action spaces.
  # The current DQN agent is designed for DISCRETE actions and will NOT work.
  # An algorithm like DDPG or SAC would be required.
  "Pendulum-v1":
    state_size: 3
    action_size: 1 # Continuous action space with 1 dimension
    win_condition: -150.0
    network:
      hidden_size: [64, 64]

  "BipedalWalker-v3":
    state_size: 24
    action_size: 4 # Continuous action space with 4 dimensions
    win_condition: 300.0
    network:
      hidden_size: [256, 256]
      
  "Swimmer-v4":
    state_size: 8
    action_size: 2
    is_continuous: false
    discrete_bins: 3 # Creates 3 discrete bins across the action dimension when is_continuous = false
    win_condition: 300.0
    network:
      hidden_size: [128, 128]

  "InvertedDoublePendulum-v5":
    state_size: 9
    action_size: 1
    is_continuous: false
    discrete_bins: 3 # Creates 3 discrete bins across the action dimension when is_continuous = false
    win_condition: 9000.0
    network:
      hidden_size: [128, 128]

agent:
  algorithm: "dqn" # Can be updated by ablation study to "a2c", "reinforce", etc.
  buffer_size: 1000000
  batch_size: 32
  gamma: 0.99
  tau: 0.005 # overrun by the tau scheduler
  lr: 0.005 # overrun by the lr scheduler
  update_every: 4 # For Acrobot, a smaller value like 1 might be better
  DQN_type: "DDQN" # This will be overridden by the ablation study
  use_replay_buffer: true
  use_target_network: true
  is_dueling: true
  use_per: true # Enable Prioritized Experience Replay
  per_alpha: 0.7 # PER alpha parameter (priority exponent)
  per_beta_start: 0.4 # PER beta parameter (initial IS weight exponent)
  per_beta_end: 1.0 # PER beta parameter (final IS weight exponent)
  per_beta_frames: 500000 # Number of frames over which beta anneals
  # For a2c
  critic_loss_weight: 0.5
  critic_lr: 0.001 # Separate LR for A2C critic optimizer (actor uses lr_start)
  entropy_weight_start: 0.003   # Initial entropy weight
  entropy_weight_end: 0.0003   # Minimum entropy weight
  entropy_weight_t_anneal: 4000 # Episodes over which entropy weight anneals linearly (0 = no annealing)
  n_steps: 64 # Number of steps for n-step returns in A2C
  gae_lambda: 0.95 # Lambda for Generalized Advantage Estimation
  num_envs: 8 # Number of parallel environments for A2C/PPO batched data collection
  share_network: false # Determines if actor and critic share a common backbone

training:
  n_episodes: 500
  max_t: 1000
  exploration:
    strategy: "epsilon_greedy" # "epsilon_greedy" or "boltzmann"
    epsilon:
      start: 1.0
      end: 0.001
      decay: 0.995 # Multiplicative decay factor per episode
    boltzmann:
      temperature_start: 1.0
      temperature_end: 0.5
      temperature_decay: 0.9999 # Multiplicative decay factor per episode
  # Learning Rate Scheduler
  lr_start: 0.001      # Initial learning rate
  lr_end: 0.0001        # Minimum learning rate
  lr_decay: 0.9999       # Multiplicative decay factor per episode
  
  # Tau Scheduler: the smaller, the slower it updates the target network
  tau_start: 0.005       # Initial tau for soft update
  tau_end: 0.0005        # Minimum tau
  tau_decay: 1.0      # Set to 1.0 to disable tau decay. Decaying tau freezes the target network.

testing:
  test_seed_base: 100000 # Base seed used for evaluation/testing to ensure environments are unseen

experiment:
  seeds: [1, 2]
  n_episodes: 3000

ablation_study:
  # Goal: test whether K critic-update epochs per rollout can rescue λ=0.95.
  #
  # Hypothesis: with a single critic pass (K=1), the critic never converges before
  # the actor consumes its value estimates. λ=0.95's noise-accumulation factor
  # (~8.7×) then dominates and corrupts the advantage signal. K>1 critic epochs
  # train the critic to better approximate the frozen TD-lambda returns before the
  # actor updates — improving advantage quality without violating the on-policy
  # constraint (returns are fixed; actor updates only once per rollout).
  #
  # Expected: K=1 fails (known lower bound), K=8 approaches λ=1.0 performance.
  # If K=8 still fails, the effective-horizon gap (17 vs 256 steps) is the true
  # bottleneck and cannot be fixed by critic quality alone.
  study_name: "A2C_CriticEpochSweep"
  generate_video: True
  n_episodes: 6000
  seeds: [1, 2]
  experiments:
    # Known failure — single critic pass, λ=0.95.
    - name: "A2C lambda=0.95 K=1"
      agent:
        algorithm: "a2c"
        gae_lambda: 0.95
        gamma: 0.99
        n_steps: 256
        critic_loss_weight: 0.5
        entropy_weight_start: 0.0
        entropy_weight_end: 0.0
        k_critic_epochs: 1

    # Moderate: 4 critic passes before the actor updates.
    - name: "A2C lambda=0.95 K=4"
      agent:
        algorithm: "a2c"
        gae_lambda: 0.95
        gamma: 0.99
        n_steps: 256
        critic_loss_weight: 0.5
        entropy_weight_start: 0.0
        entropy_weight_end: 0.0
        k_critic_epochs: 4

    # Strong: 8 critic passes — close to what PPO typically uses.
    - name: "A2C lambda=0.95 K=8"
      agent:
        algorithm: "a2c"
        gae_lambda: 0.95
        gamma: 0.99
        n_steps: 256
        critic_loss_weight: 0.5
        entropy_weight_start: 0.0
        entropy_weight_end: 0.0
        k_critic_epochs: 8

    # Upper bound reference — λ=1.0 is structurally immune to critic noise.
    - name: "A2C lambda=1.0 K=1"
      agent:
        algorithm: "a2c"
        gae_lambda: 1.0
        gamma: 0.99
        n_steps: 256
        critic_loss_weight: 0.5
        entropy_weight_start: 0.0
        entropy_weight_end: 0.0
        k_critic_epochs: 1