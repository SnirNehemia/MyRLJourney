project:
  version: "1.6.0"
  seed: 0

active_env: "Hopper-v4"

save_parameters:
  run_name: "PPO_Hopper"
  n_gifs: 5
  show_plots: false # Set to true to display plots, false to only save them
  add_saliency_to_gif: true # Set to true to add a saliency plot to the GIF

environments:
  "LunarLander-v3":
    state_size: 8
    action_size: 4
    win_condition: 200.0
    network:
      hidden_size: [128, 128]
    state_labels: ['X-pos', 'Y-pos', 'X-vel', 'Y-vel', 'Angle', 'Ang-vel', 'Leg1', 'Leg2']
    action_labels: ['No-Op', 'Left', 'Main', 'Right']
    use_fake_actions: false
    num_fake_actions: 6
    fake_action_maps_to: 0 # The real action that fake actions should map to
    q_plot_range: [-200, 200] # For GIF Q-value plot
    sparse_reward: false
      
    lunar_params:
      gravity: -10.0
      enable_wind: true
      wind_power: 1.0
      turbulence_power: 0.1

  "LunarLanderContinuous-v2":
    state_size: 8
    action_size: 2 # Continuous
    win_condition: 200.0
    network:
      hidden_size: [128, 128]
    state_labels: ['X-pos', 'Y-pos', 'X-vel', 'Y-vel', 'Angle', 'Ang-vel', 'Leg1', 'Leg2']
    action_labels: ['Main Engine', 'Side Engine']
    use_fake_actions: false
    num_fake_actions: 0
    fake_action_maps_to: 0 
    q_plot_range: [-200, 200]
    sparse_reward: false
    is_continuous: true
    lunar_params:
      gravity: -10.0
      enable_wind: false

  "Acrobot-v1":
    state_size: 6
    action_size: 3
    win_condition: -100.0
    network:
      hidden_size: [64, 64]
    action_labels: ['Torque -1', 'Torque 0', 'Torque +1']
    use_fake_actions: false
    num_fake_actions: 6
    fake_action_maps_to: 0 # The real action that fake actions should map to
    v_plot_range: [-500, 0] # For A2C critic value plot

  "CartPole-v1":
    state_size: 4
    action_size: 2
    win_condition: 475.0
    network:
      hidden_size: [32, 32]
    use_fake_actions: false
    num_fake_actions: 3
    fake_action_maps_to: 0 # The real action that fake actions should map to

  "MountainCar-v0":
    state_size: 2
    action_size: 3
    win_condition: -110.0 # Solved is avg score of -110.0 over 100 consecutive trials.
    network:
      hidden_size: [64, 64]
    state_labels: ['Position', 'Velocity']
    action_labels: ['Push Left', 'No Push', 'Push Right']
    use_fake_actions: false
    num_fake_actions: 2
    fake_action_maps_to: 1 # The real action that fake actions should map to
    q_plot_range: [-200, 50] # For GIF Q-value plot

  # NOTE: The environments below have CONTINUOUS action spaces.
  # The current DQN agent is designed for DISCRETE actions and will NOT work.
  # An algorithm like DDPG or SAC would be required.
  "Pendulum-v1":
    state_size: 3
    action_size: 1 # Continuous action space with 1 dimension
    win_condition: -150.0
    is_continuous: true
    network:
      hidden_size: [64, 64]

  "Hopper-v4":
    state_size: 11
    action_size: 3 # Continuous action space with 3 dimensions
    is_continuous: true
    win_condition: 2500.0   # strong-policy target (not an official "solved" threshold)
    network:
      hidden_size: [64, 64] # standard PPO MuJoCo size
    v_plot_range: [0, 3000] # for the critic value plot in GIFs

  "BipedalWalker-v3":
    state_size: 24
    action_size: 4 # Continuous action space with 4 dimensions
    win_condition: 300.0
    network:
      hidden_size: [256, 256]
      
  "Swimmer-v4":
    state_size: 8
    action_size: 2
    is_continuous: false
    discrete_bins: 3 # Creates 3 discrete bins across the action dimension when is_continuous = false
    win_condition: 300.0
    network:
      hidden_size: [128, 128]

  "InvertedDoublePendulum-v5":
    state_size: 9
    action_size: 1
    is_continuous: false
    discrete_bins: 3 # Creates 3 discrete bins across the action dimension when is_continuous = false
    win_condition: 9000.0
    network:
      hidden_size: [128, 128]

agent:
  algorithm: "ppo" # Can be updated by ablation study to "a2c", "reinforce", "ppo", etc.
  buffer_size: 1000000
  batch_size: 32
  gamma: 0.99
  tau: 0.005 # overrun by the tau scheduler
  lr: 0.005 # overrun by the lr scheduler
  update_every: 4 # For Acrobot, a smaller value like 1 might be better
  DQN_type: "DDQN" # This will be overridden by the ablation study
  use_replay_buffer: true
  use_target_network: true
  is_dueling: true
  use_per: true # Enable Prioritized Experience Replay
  per_alpha: 0.7 # PER alpha parameter (priority exponent)
  per_beta_start: 0.4 # PER beta parameter (initial IS weight exponent)
  per_beta_end: 1.0 # PER beta parameter (final IS weight exponent)
  per_beta_frames: 500000 # Number of frames over which beta anneals
  # For a2c
  critic_loss_weight: 0.5
  critic_lr: 0.001  # PPO (separate network mode): higher LR for critic to converge before actor updates
  entropy_weight_start: 0.0   # PPO on Pendulum: no entropy needed (Normal std handles exploration)
  entropy_weight_end: 0.0
  entropy_weight_t_anneal: 0
  n_steps: 512   # Steps per env per rollout.
  gae_lambda: 0.95 # Lambda for Generalized Advantage Estimation
  num_envs: 4 # Number of parallel environments for A2C/PPO batched data collection
  share_network: false # Separate actor/critic for PPO: prevents critic gradient interference
                       # With share_network=True, the large early critic loss (MSE ~11000)
                       # dominates the shared backbone before the actor has learned anything,
                       # causing the actor's first big update to go in a noisy direction.
                       # Separate networks give each head a dedicated gradient path.

  # PPO-specific hyperparameters
  # ppo_clip_eps: the ε in clip(r, 1−ε, 1+ε). 0.2 is the standard starting point.
  ppo_clip_eps: 0.2
  # ppo_epochs: how many full passes over the rollout data per update.
  # A2C does 1 actor pass. PPO can safely do 10+ because of clipping.
  ppo_epochs: 10
  # num_minibatches: the rollout is split into this many random minibatches each epoch.
  # Adds stochasticity and lets you use larger rollouts without huge per-step memory.
  num_minibatches: 32  # 512×4 envs = 2048 / 32 = 64 samples per minibatch (MuJoCo standard)
  # normalize_advantage: rescale advantages to ~N(0,1) per minibatch.
  # Keeps the policy gradient scale consistent regardless of reward magnitude.
  normalize_advantage: true
  # clip_value_loss: apply the same clipping idea to the value function update.
  # Prevents the critic from changing faster than the frozen GAE targets expect.
  clip_value_loss: true
  # target_kl: stop PPO epochs early if approximate KL exceeds this threshold.
  # A second safety valve on top of clipping. Set to 0 to disable.
  k_critic_epochs: 4    # PPO: critic-only warmup epochs before each actor PPO phase.
                        # Gives the critic a head start so advantages are meaningful.
  target_kl: 0.01        # Disable KL early-stop for now (clipping is sufficient)

training:
  n_episodes: 20000  # Hopper needs ~3M env steps: 20k eps × ~150-step avg / (4 envs × 512) ≈ 1465 rollouts
  max_t: 1000        # Hopper-v4's built-in episode limit
  exploration:
    strategy: "epsilon_greedy" # "epsilon_greedy" or "boltzmann"
    epsilon:
      start: 1.0
      end: 0.001
      decay: 0.995 # Multiplicative decay factor per episode
    boltzmann:
      temperature_start: 1.0
      temperature_end: 0.5
      temperature_decay: 0.9999 # Multiplicative decay factor per episode
  # Learning Rate Scheduler (PPO uses a fixed small lr; set decay=1.0 to disable)
  lr_start: 0.0003     # 3e-4 is the standard PPO learning rate
  lr_end: 0.0001
  lr_decay: 1.0        # No decay for PPO baseline run
  
  # Tau Scheduler: the smaller, the slower it updates the target network
  tau_start: 0.005       # Initial tau for soft update
  tau_end: 0.0005        # Minimum tau
  tau_decay: 1.0      # Set to 1.0 to disable tau decay. Decaying tau freezes the target network.

testing:
  test_seed_base: 100000 # Base seed used for evaluation/testing to ensure environments are unseen

experiment:
  seeds: [1, 2]
  n_episodes: 3000

ablation_study:
  # Goal: test whether PPO's clipping mechanism actually enables safe data reuse
  # across multiple epochs over the same rollout — on a harder MuJoCo task (Hopper-v4).
  #
  # Hypothesis: at E=1 PPO degrades to A2C-like data efficiency (clipping never
  # activates on the first pass). As epochs increase, clipping constrains the
  # policy ratio and allows the agent to extract more signal per rollout without
  # diverging. Expected: E=10 converges fastest; E=1 converges slowest.
  # Hopper is harder than Pendulum, so the gap between epoch counts should be more visible.
  study_name: "PPO_EpochSweep_Hopper"
  generate_video: true
  n_episodes: 20000  # ~3M env steps at avg 150-step episodes with 4 envs
  seeds: [1, 2]
  experiments:
    # Baseline — one pass per rollout, clipping never activates. A2C-like data efficiency.
    - name: "PPO E=1 (A2C-like)"
      agent:
        algorithm: "ppo"
        ppo_epochs: 1
        ppo_clip_eps: 0.2
        num_minibatches: 32
        n_steps: 512
        normalize_advantage: true
        clip_value_loss: true

    # Moderate reuse — clipping starts to constrain the update.
    - name: "PPO E=4"
      agent:
        algorithm: "ppo"
        ppo_epochs: 4
        ppo_clip_eps: 0.2
        num_minibatches: 32
        n_steps: 512
        normalize_advantage: true
        clip_value_loss: true

    # Full PPO — standard recipe, maximum safe reuse per rollout.
    - name: "PPO E=10 (standard)"
      agent:
        algorithm: "ppo"
        ppo_epochs: 10
        ppo_clip_eps: 0.2
        num_minibatches: 32
        n_steps: 512
        normalize_advantage: true
        clip_value_loss: true